name: publish-contribution-city
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: write
concurrency:
  group: contribution-city-output
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out the action and publishing example
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myfear/quarkus-contribution-city
          ref: v1
          path: .city-action
          persist-credentials: false
      - name: Generate contribution city
        id: city
        uses: ./.city-action
        with:
          github-token: ${{ secrets.CONTRIBUTION_TOKEN || secrets.GITHUB_TOKEN }}
          username: ${{ github.repository_owner }}
      - name: Publish only changed SVGs
        shell: bash
        run: bash .city-action/examples/publish-output.sh
