name: contribution-city
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution city
        id: city
        uses: myfear/quarkus-contribution-city@v1
        with:
          github-token: ${{ secrets.CONTRIBUTION_TOKEN || secrets.GITHUB_TOKEN }}
          username: ${{ github.repository_owner }}
          weeks: '53'
          height: '14'
          theme: github-dark
      - name: Show result
        env:
          SVG_PATH: ${{ steps.city.outputs.svg-path }}
        run: ls -lh "$SVG_PATH"
      - name: Downloadable SVG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contribution-city
          path: contribution-city.svg
